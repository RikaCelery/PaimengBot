<script>
    function mergeImagesIntoDiv() {
        // 获取.message元素
        const messageElement = document.querySelector('.message');

        if (!messageElement) {
            console.error('没有找到.message元素');
            return;
        }

        // 创建新的<div class="imgs">
        const imgsContainer = document.createElement('div');
        imgsContainer.className = 'imgs';

        // 用于存储连续的img元素
        let imgElements = [];
        let inImageSequence = false;
        let firstImgParent = null; // 用于记录第一个img的父节点

        // 遍历.message下的所有子节点
        for (let node of messageElement.childNodes) {
            if (node.nodeType === Node.ELEMENT_NODE) { // 只处理元素节点
                if (node.tagName.toLowerCase() === 'img' && node.className !== 'smile_ac') {
                    // 直接是img的情况
                    imgElements.push(node);
                    if (!firstImgParent) firstImgParent = node; // 记录第一个img的父节点
                    inImageSequence = true;
                } else if ((node.tagName.toLowerCase() === 'p' || node.tagName.toLowerCase() === 'span') && node.querySelector('img')) {
                    // 是包含img的p元素的情况
                    Array.from(node.querySelectorAll('img')).forEach(img => imgElements.push(img));
                    if (!firstImgParent) firstImgParent = node.parentNode; // 记录第一个img的父节点
                    inImageSequence = true;
                } else if (node.tagName.toLowerCase() !== 'br' && inImageSequence) {
                    // 如果遇到非img、非包含img的p元素且不是br元素，并且之前处于img序列中
                    break; // 结束循环，因为遇到了中断连接的节点
                }
            } else if (node.nodeType === Node.TEXT_NODE && !/^\s*$/.test(node.nodeValue) && inImageSequence) {
                // 如果遇到非空白文本节点，且之前处于img序列中，同样视为中断连接
                break;
            }
        }

        // 如果找到了img元素
        if (imgElements.length > 0) {
            // 将img元素添加到新的div中
            imgElements.forEach(img => {
                const wrap = document.createElement("div")
                wrap.className = "img-wrap";
                wrap.appendChild(img.cloneNode(true));
                imgsContainer.appendChild(wrap); // 克隆节点以避免从DOM中移除原始节点
            });

            // 在第一个img的位置插入新的div
            if (firstImgParent) {
                messageElement.insertBefore(imgsContainer, firstImgParent);
            }

            // 移除原始的img元素
            imgElements.forEach(img => img.parentNode.removeChild(img));

            // 清理空的p元素
            messageElement.querySelectorAll('p:empty, br').forEach(el => el.parentNode.removeChild(el));
        }
    }


    mergeImagesIntoDiv()
    let n = 0
    const ee = document.querySelector("main")
    // while (ee.scrollHeight > 3000) {

    //     const adjusted = height - 10
    //     document.documentElement.style.setProperty("--max-height", (adjusted).toFixed(0) + "px")
    //     if (n++ > 100 || adjusted < 300)
    //         break
    // }
    document.querySelectorAll(".message").forEach(msg => {
        const quote = msg.querySelector("blockquote")
        if (!quote) return
        const parent = quote.parentNode
        quote.remove()
        parent.appendChild(quote)
    })
    document.querySelectorAll(".message a").forEach(a => {
        const match = /uid=(\d+)/.exec(a.href)
        if (match) {
            a.innerHTML += `(${match[1]})`
        }
    })
</script>
