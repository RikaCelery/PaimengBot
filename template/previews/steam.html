{{(index .Items 0).Description|escape }}
<style>
  .template {
    position: fixed;
    top: 0;
    left: 0;
    opacity: 0.3;
  }

  .name {
    font-family: "Familjen Grotesk", sans-serif;
    font-optical-sizing: auto;
    font-size: calc(1rem + 1vw);
    font-weight: 400;
    font-style: italic;
  }

  * {
    box-sizing: border-box;
    padding: 0;
    margin: 0;
  }

  html {
    font-family: "Noto Sans SC","Noto Sans TC","Noto Sans JP","Noto Sans KR", "Noto Sans Math", "Noto Color Emoji",sans-serif;
  }
  body {
    padding: 10px;
    background: linear-gradient(45deg, #ffefef, #ddefff);
  }

  main {
    width: 100%;
    background-color: rgba(255, 255, 255, 0.254);
    border-radius: 2em;
    overflow: hidden;
    padding: 1em;
    box-shadow: 0px 0px 20px #00000021;
  }

  .header {
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: end;
    gap: 0em;
    /* margin-bottom: .5em; */
  }

  .author-logo,
  .platform-logo {
    /* width: 50px; */
    height: 100%;
    overflow: hidden;
  }

  .author-logo {
    padding: 15px;
  }

  .platform-logo {
    padding: 15px 0;
  }

  .author-logo img {
    border-radius: 999px !important;
  }

  .author-name {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .author-name .nick {
    font-size: calc(1vw + 14px);
    font-weight: 600;
  }

  .author-name .id {
    color: gray;
    font-size: calc(1vw + 10px);
    font-weight: 300;
  }

  .content {
    padding: 10px;
    font-size: calc(1vw + 15px);
  }

  .content img,
  .content video {
    display: block;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
    height: auto;
    /*max-height: 600px;*/
    border-radius: 5px;
  }

  .header img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .rsshub-quote {
    background-color: rgba(255, 255, 255, 0.454);
    border: 1px solid #2e2e2e1f;
    border-radius: 20px;
    padding: 10px;
    margin-top: 10px;
  }

  .tag {
    color: rgb(0, 170, 255);
  }

  footer {
    font-size: small;
    padding-top: 7px;
    text-align: center;
    font-weight: 300;
    color: rgb(162, 162, 162);
  }
</style>
<script>
  document.querySelector("main").innerHTML = document.querySelector("main").innerHTML.replace(/#[^< ]+/g, function (str) {
    console.log(str);
    return `<span class="tag">${str}</span>`
  })
</script>

</html>
